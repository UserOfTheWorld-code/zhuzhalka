name: Build Android APKs

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed v0.3.0-alpha.2 after all checks pass (master only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish_release && 'publish' || 'build' }}
  cancel-in-progress: ${{ !inputs.publish_release }}

jobs:
  build:
    name: Test and build both distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: 37.0.0
      ANDROID_NDK_VERSION: 30.0.16248370

    steps:
      - name: Check out source and pinned native submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            V2rayNG/**/*.gradle.kts
            V2rayNG/gradle/libs.versions.toml
            V2rayNG/gradle/wrapper/gradle-wrapper.properties

      # The hosted image includes the SDK and accepted licenses. The script checks
      # exact package versions and never accepts additional license terms itself.
      - name: Verify native inputs, run unit tests, and assemble debug APKs
        if: ${{ !inputs.publish_release }}
        run: bash scripts/build-android.sh

      # Private signing data is available only in an explicitly requested run of
      # trusted master. PRs and ordinary pushes never receive these secrets.
      - name: Test and build with the permanent release identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
        env:
          ZHUZHALKA_KEYSTORE_BASE64: ${{ secrets.ZHUZHALKA_KEYSTORE_BASE64 }}
          ZHUZHALKA_KEYSTORE_PASSWORD: ${{ secrets.ZHUZHALKA_KEYSTORE_PASSWORD }}
          ANDROID_BUILD_TYPE: release
        run: |
          test -n "$ZHUZHALKA_KEYSTORE_BASE64" && test -n "$ZHUZHALKA_KEYSTORE_PASSWORD" || {
            echo 'Configure the two permanent signing secrets before publishing.' >&2
            exit 1
          }
          umask 077
          export ZHUZHALKA_KEYSTORE_PATH="$RUNNER_TEMP/zhuzhalka-release.jks"
          trap 'rm -f -- "$ZHUZHALKA_KEYSTORE_PATH"' EXIT
          printf '%s' "$ZHUZHALKA_KEYSTORE_BASE64" | base64 --decode > "$ZHUZHALKA_KEYSTORE_PATH"
          unset ZHUZHALKA_KEYSTORE_BASE64
          bash scripts/build-android.sh

      # Debug builds remain available for development, never as release assets.
      - name: Prepare the two downloadable APKs
        if: ${{ !inputs.publish_release }}
        run: |
          mkdir ci-apks
          cp V2rayNG/app/build/outputs/apk/playstore/debug/Zhuzhalka_0.3.0-alpha.2_arm64-v8a.apk ci-apks/
          cp V2rayNG/app/build/outputs/apk/playstore/debug/Zhuzhalka_0.3.0-alpha.2_universal.apk ci-apks/
          cd ci-apks
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload APKs and SHA-256 checksums
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zhuzhalka-debug-apks
          path: ci-apks/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Package alpha release assets from this commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
        run: |
          python3 scripts/package-release.py --output release-dist

      - name: Upload checked alpha release bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zhuzhalka-alpha-release
          path: release-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload unit test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish verified alpha assets
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's checked release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zhuzhalka-alpha-release
          path: release-dist

      - name: Verify uploaded assets and publish the alpha draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh release-dist
