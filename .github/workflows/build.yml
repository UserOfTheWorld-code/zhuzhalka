name: Build Android APKs

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build both distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: 37.0.0
      ANDROID_NDK_VERSION: 30.0.16248370

    steps:
      - name: Check out source and pinned native submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            V2rayNG/**/*.gradle.kts
            V2rayNG/gradle/libs.versions.toml
            V2rayNG/gradle/wrapper/gradle-wrapper.properties

      # The hosted image includes the SDK and accepted licenses. The script checks
      # exact package versions and never accepts additional license terms itself.
      - name: Verify native inputs, run unit tests, and assemble debug APKs
        run: bash scripts/build-android.sh

      # Debug APKs use Android's normal debug signing. No release key or secret
      # is required, and this workflow does not publish a GitHub Release.
      - name: Upload APKs and SHA-256 checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zhuzhalka-debug-apks
          path: |
            V2rayNG/app/build/outputs/apk/**/*.apk
            V2rayNG/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload unit test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
